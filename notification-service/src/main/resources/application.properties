spring.application.name=notification
server.port=8085
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/sayless}
spring.data.mongodb.database=sayless
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=taskCreated:com.sayless.notification.event.TaskCreatedEvent,taskAssigned:com.sayless.notification.event.TaskAssignedEvent,taskCompleted:com.sayless.notification.event.TaskCompletedEvent,taskUpdated:com.sayless.notification.event.TaskUpdatedEvent,friendRequestSent:com.sayless.notification.event.FriendRequestSentEvent,friendRequestAccepted:com.sayless.notification.event.FriendRequestAcceptedEvent
