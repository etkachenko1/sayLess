spring.application.name=notification
server.port=${SERVER_PORT:8085}
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/sayless}
spring.data.mongodb.database=sayless
cors.allowed-origins=http://localhost:5173,http://localhost:3000
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.security.protocol=SASL_PLAINTEXT
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
spring.kafka.consumer.group-id=notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sayless.notification.event
spring.kafka.consumer.properties.spring.json.type.mapping=taskCreated:com.sayless.notification.event.TaskCreatedEvent,taskAssigned:com.sayless.notification.event.TaskAssignedEvent,taskCompleted:com.sayless.notification.event.TaskCompletedEvent,taskUpdated:com.sayless.notification.event.TaskUpdatedEvent,taskDeleted:com.sayless.notification.event.TaskDeletedEvent,friendRequestSent:com.sayless.notification.event.FriendRequestSentEvent,friendRequestAccepted:com.sayless.notification.event.FriendRequestAcceptedEvent
