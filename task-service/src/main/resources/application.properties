spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/sayless}
server.port=${SERVER_PORT:8082}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
cors.allowed-origins=http://localhost:5173,http://localhost:3000
logging.level.root=INFO
#kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.security.protocol=SASL_PLAINTEXT
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=taskCreated:com.sayless.task.event.TaskCreatedEvent,taskAssigned:com.sayless.task.event.TaskAssignedEvent,taskCompleted:com.sayless.task.event.TaskCompletedEvent,taskUpdated:com.sayless.task.event.TaskUpdatedEvent,taskDeleted:com.sayless.task.event.TaskDeletedEvent
