apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
type: Opaque
stringData:
  JWT_SECRET: replace-with-a-long-random-string
  MONGO_URI: mongodb://mongo:27017/sayless
---
# This file is a template, not a real secret. Copy it, fill in real
# values, and apply your copy instead. You can also skip the file and
# create the secret directly from the CLI:
#
#   kubectl create secret generic auth-secret \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=MONGO_URI=mongodb://mongo:27017/sayless
#
# Worth knowing: auth, task, friend and notification-service all read
# JWT_SECRET from this same secret, so they need to agree on it. That
# makes this the one Secret the cluster needs before `kubectl apply -f k8s/`
# will fully work.
