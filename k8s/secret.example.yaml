# Template, not a real secret.
#
#   kubectl create secret generic auth-secret \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=MONGO_ROOT_USERNAME=sayless_admin \
#     --from-literal=MONGO_ROOT_PASSWORD=$(openssl rand -hex 16) \
#     --from-literal=MONGO_URI=mongodb://sayless_admin:<same-password-as-above>@mongo:27017/sayless?authSource=admin \
#     --from-literal=KAFKA_USERNAME=sayless_kafka \
#     --from-literal=KAFKA_PASSWORD=$(openssl rand -hex 16) \
#     --from-literal=AI_OPERATOR_SECRET=$(openssl rand -hex 32)
#
#
# Every service reads JWT_SECRET and MONGO_URI from here, so this is the one
# Secret the cluster needs before `kubectl apply -f k8s/` will work.
#
# MONGO_ROOT_USERNAME/PASSWORD are used by the mongo Deployment to create the
# root user, and must match the credentials embedded in MONGO_URI. Same for
# KAFKA_USERNAME/PASSWORD, which set up the broker's SASL user and are reused
# by task, friend, and notification-service as clients.
#
# AI_OPERATOR_SECRET gates ai-service's /train endpoint. There's no role system
# in this app, so it's a shared secret checked against an X-Operator-Secret
# header rather than a per-user permission.
#
# Mongo only creates the root user on a fresh volume. Turning auth on for
# an existing cluster means deleting the PVC and reseeding.


apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
type: Opaque
stringData:
  JWT_SECRET: replace-with-a-long-random-string
  MONGO_ROOT_USERNAME: sayless_admin
  MONGO_ROOT_PASSWORD: replace-with-a-long-random-string
  MONGO_URI: mongodb://sayless_admin:replace-with-a-long-random-string@mongo:27017/sayless?authSource=admin
  KAFKA_USERNAME: sayless_kafka
  KAFKA_PASSWORD: replace-with-a-long-random-string
  AI_OPERATOR_SECRET: replace-with-a-long-random-string
---
