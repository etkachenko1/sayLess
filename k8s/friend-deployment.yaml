apiVersion: apps/v1
kind: Deployment
metadata:
  name: friend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: friend-service
  template:
    metadata:
      labels:
        app: friend-service
    spec:
      containers:
        - name: friend-service
          image: friend-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 40
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8081
            - name: CORS_ALLOWED_ORIGINS
              value: http://sayless.local
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: MONGO_URI